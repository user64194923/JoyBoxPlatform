<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JoyBox Platform</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="topbar">
        <div class="logo">
            <span class="logo-text">JoyBox</span>
        </div>

        <nav class="nav-right" id="navRight">
            <a href="/login.html" class="nav-link">Sign in</a>
            <a href="/register.html" class="nav-btn primary">Sign up</a>
        </nav>
    </header>

    <main>

        <!-- HERO -->
        <section class="hero">
            <h1 class="hero-title">JoyBox</h1>
            <p class="hero-subtitle">
                A modern platform for hosting and playing WebGL games
            </p>
        </section>

        <!-- GAMES -->
        <section id="gamesSection">
            <h2 class="section-title">Available Games</h2>
            <div id="gamesContainer" class="game-grid"></div>
            <div id="gamesError" class="error"></div>
        </section>

    </main>

    <script>
        async function loadGames() {
            const container = document.getElementById('gamesContainer');
            const errorDiv = document.getElementById('gamesError');

            try {
                const response = await fetch('/api/games');
                if (!response.ok) throw new Error();

                const games = await response.json();
                container.innerHTML = '';

                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';

                    const iconPath = `${game.buildFolderPath}/icon.png`;

                    card.innerHTML = `
                                    <img class="game-icon"
                                         src="${iconPath}"
                                         onerror="this.src='images/default-game.png'">

                                    <div class="game-content">
                                        <div class="game-title">${game.title}</div>
                                        <div class="game-description">${game.description}</div>

                                        <button class="play-btn" onclick="playGame(${game.id})">
                                            ▶ Play
                                        </button>
                                    </div>
                                `;

                    container.appendChild(card);
                });
            } catch {
                errorDiv.textContent = 'Failed to load games.';
            }
        }

        function playGame(id) {
            window.location.href = `/playgame.html?id=${id}`;
        }
        loadGames();
    </script>

    <script>
        (async () => {
            const res = await fetch("/api/users/me", { credentials: "include" });
            if (!res.ok) return;

            const user = await res.json();

            const nav = document.getElementById("navRight");
            nav.innerHTML = `
            <div class="user-menu">
                <button class="user-trigger" id="userTrigger">
                    ${user.nickname} ▾
                </button>
                <div class="dropdown" id="userDropdown">
                    <a href="/profile.html">Profile</a>
                    <a href="/upload.html">Upload Game</a>
                    <hr>
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
            </div>
        `;

            const trigger = document.getElementById("userTrigger");
            const dropdown = document.getElementById("userDropdown");

            trigger.addEventListener("click", e => {
                e.stopPropagation();
                dropdown.classList.toggle("open");
            });

            dropdown.addEventListener("click", e => e.stopPropagation());

            document.addEventListener("click", () => {
                dropdown.classList.remove("open");
            });

            document.getElementById("logoutBtn").addEventListener("click", async e => {
                e.preventDefault();
                await fetch("/api/users/logout", {
                    method: "POST",
                    credentials: "include"
                });
                location.reload();
            });
        })();
    </script>





</body>
</html>
