<main class="page upload-page">
    <link rel="stylesheet" href="/css/upload.css">
    <a href="/" class="home-btn">Home</a>
    <div class="card upload-card wide">
        <div class="upload-header">
            <h2>Upload a New Game</h2>
            <p class="muted">Share your WebGL game with the JoyBox community.</p>
        </div>

        <form id="uploadForm" class="upload-form">
            <div class="form-group">
                <label>Game title</label>
                <input type="text" id="title" placeholder="My Awesome Game" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="description"
                          placeholder="Short description of your game"
                          required></textarea>
            </div>

            <div class="form-group">
                <label>Game build (.zip)</label>

                <label class="file-drop">
                    <input type="file" id="zipFile" accept=".zip" hidden required>
                    <span id="fileLabel">📦 Click to select ZIP file</span>
                </label>
            </div>

            <button type="submit" class="primary-btn large">
                Upload Game
            </button>

            <div class="progress-bar">
                <div class="progress-fill" id="uploadProgress"></div>
            </div>

        </form>

        <div id="uploadError" class="error"></div>
        <div id="uploadSuccess" class="success"></div>
    </div>
</main>

<script>
    document.getElementById("uploadForm").addEventListener("submit", async e => {
        e.preventDefault();

        const error = document.getElementById("uploadError");
        const success = document.getElementById("uploadSuccess");
        error.textContent = "";
        success.textContent = "";

        const formData = new FormData();
        formData.append("Title", document.getElementById("title").value);
        formData.append("Description", document.getElementById("description").value);
        formData.append("ZipFile", document.getElementById("zipFile").files[0]);

        try {
            const res = await fetch("/api/games/upload", {
                method: "POST",
                body: formData,
                credentials: "include"
            });

            if (!res.ok) {
                const text = await res.text();
                throw new Error(text);
            }

            success.textContent = "✅ Game uploaded successfully!";
            document.getElementById("uploadForm").reset();
            document.getElementById("fileLabel").textContent =
                "📦 Click to select ZIP file";

        } catch (err) {
            error.textContent = err.message || "Upload failed";
        }
    });
</script>
